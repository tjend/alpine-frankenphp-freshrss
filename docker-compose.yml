services:
  app:
    build: .
    image: localhost/alpine-frankenphp-freshrss:latest
    volumes:
      - freshrss-data:/app/data
  cron:
    # use the freshrss image, but override the entrypoint and healthcheck
    entrypoint: /usr/bin/supercronic /etc/crontab
    healthcheck:
      test: supercronic -test /etc/crontab
    image: localhost/alpine-frankenphp-freshrss:latest
    volumes:
      - freshrss-data:/app/data
  format:
    image: docker.io/tjend/alpine-dprint:latest
    profiles: [cli]
    volumes:
      - .:/app
    working_dir: /app
  lint-dockerfile:
    image: docker.io/hadolint/hadolint:latest-alpine
    profiles: [cli]
    volumes:
      - .:/app
    working_dir: /app
  lint-github-actions:
    image: docker.io/rhysd/actionlint:latest
    profiles: [cli]
    volumes:
      - ./.github:/app/.github
    working_dir: /app
  proxy:
    image: docker.io/caddy:latest
    ports:
      - 8443:8443
    volumes:
      - ./Caddyfile.proxy:/etc/caddy/Caddyfile
  updatecli:
    environment:
      UPDATECLI_DISABLE_VERSION_CHECK: disable
      # uses .env in local dev, provided by github actions
      UPDATECLI_GITHUB_TOKEN: ${UPDATECLI_GITHUB_TOKEN}
    image: docker.io/updatecli/updatecli:latest-slim
    profiles: [cli]
    volumes:
      - .:/app
      - ./.tmp:/tmp/updatecli
    working_dir: /app
volumes:
  freshrss-data:
