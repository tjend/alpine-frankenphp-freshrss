name: format check dockerfile + github actions
on:
  push:
    paths:
      - ".github/workflows/**"
      - Dockerfile
jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: copy .env
        run: cp .env.example .env
      - name: format check dockerfile
        run: make format_check_dockerfile
      - name: format check github actions
        run: make format_check_github_actions
